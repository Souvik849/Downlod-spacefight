<!DOCTYPE html>
<html lang="en" style="background:#02030a">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>html,body{background:#02030a!important}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Space Fight</title>
<meta name="theme-color" content="#02030a">
<style>
:root{--bg:#02030a;--ink:#8ff3ff;--dim:#4aa8c0;--red:#ff4b4b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#02030a}}
html,body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:geometricPrecision;height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Rajdhani","Trebuchet MS",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none}
#wrap{position:relative;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;font-size:15px;letter-spacing:1px;pointer-events:none}
.hud b{display:block;font-size:30px;font-weight:600;line-height:1}
#bar{width:110px;height:8px;background:#0b2a33;margin-top:8px}
#bar i{display:block;height:100%;background:var(--ink);width:100%;box-shadow:0 0 8px var(--ink)}
#fire{position:absolute;right:18px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;border:0;background:#d6372f;color:#fff;font:600 18px inherit;box-shadow:0 0 18px #d6372f88}
#fire:active{transform:scale(.94)}
#menu{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 28px;background:linear-gradient(90deg,#02030acc,#02030a22)}
#menu h1{margin:0;font-size:46px;line-height:1;color:#fff;text-shadow:0 0 18px var(--ink)}
#menu h2{margin:4px 0 28px;font-weight:500;font-size:22px;letter-spacing:12px;color:var(--ink)}
#menu button{background:none;border:0;color:var(--ink);font:500 24px inherit;text-align:left;padding:8px 0;text-shadow:0 0 10px var(--ink)}
#menu p{margin:14px 0 0;color:var(--dim);max-width:300px;font-size:16px;line-height:1.4}
#joy{position:absolute;left:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;border:2px solid #4aa8c0;background:#0b2a3355;box-shadow:0 0 14px #4aa8c044;touch-action:none}
#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:var(--ink);box-shadow:0 0 12px var(--ink);pointer-events:none}
#orb{--h:100%;--c:#00bcd4;position:relative;isolation:isolate;width:64px;height:64px;margin-top:6px;border-radius:50%;border:1.5px solid #05414d;background:linear-gradient(to top,var(--c) var(--h),#0b2a33 var(--h));display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 14px var(--c);font-weight:700;line-height:1;color:#1f8a4c}
#orb::before{content:"";position:absolute;inset:-14px;z-index:-1;background:var(--c);opacity:.6;filter:blur(8px);border-radius:43% 57% 52% 48%/55% 45% 58% 42%;animation:splash 7s linear infinite}
#orb span{font-size:24px;letter-spacing:1px}#orb small{font-size:11px;margin-top:2px;color:#e8fdff}
@keyframes splash{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#orb::before{animation:none}}
.hide{display:none!important}
.hud{transition:opacity .4s}body.m .hud{opacity:0}
#hb,#sb{display:flex;align-items:center;height:30px}#sb{flex-direction:row-reverse}
.cap{width:30px;height:30px;box-sizing:border-box;background:#fff;border:3px solid #4a0a24;color:#e0245e;font:900 24px/22px system-ui,sans-serif;text-align:center;border-radius:4px;z-index:1}
#hb .trk{width:120px;height:20px;box-sizing:border-box;background:#3a0719;border:3px solid #4a0a24;border-left:0;border-right:0;margin:0 -2px;overflow:hidden}
#hb i{display:block;height:100%;width:100%;background:repeating-linear-gradient(115deg,#ff3d7f 0 12px,#c01a57 12px 16px);transition:width .3s}
#sb .cap{border-radius:50%;color:#f0a800;border-color:#5a3600;font-size:17px;line-height:24px}
#sb .num{min-width:84px;height:20px;box-sizing:border-box;background:#3b2704;border:3px solid #5a3600;border-right:0;margin-right:-2px;padding:0 10px 0 8px;color:#ffd13a;font:900 15px/14px system-ui,sans-serif;text-align:right;letter-spacing:1px}
#ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:radial-gradient(ellipse at center,#02030a99,#02030a22 70%);transition:opacity .4s,transform .4s;font-family:"Trebuchet MS",system-ui,"Noto Sans Bengali",sans-serif}
#ui.hide{display:flex!important;opacity:0;pointer-events:none;transform:scale(1.08)}
#title{font-weight:900;font-size:34px;color:#fff;letter-spacing:2px;text-shadow:0 0 18px #8ff3ff,0 3px 0 #0a3a4a;animation:flt 3.2s ease-in-out infinite}
.panel{position:relative;width:min(290px,84vw);background:linear-gradient(#34465f,#27364c);border:4px solid #0f1724;border-radius:14px 14px 34px 34px;box-shadow:0 10px 0 #0005,0 0 40px #000a;padding:62px 22px 22px;animation:pop .55s cubic-bezier(.2,1.5,.4,1) both}
.panel>h3{position:absolute;left:-4px;right:-4px;top:-4px;margin:0;height:48px;line-height:46px;text-align:center;font-weight:900;font-size:22px;letter-spacing:1px;color:#fff;background:linear-gradient(#5c87c9,#3d64a8);border:4px solid #0f1724;border-radius:14px 14px 0 0;-webkit-text-stroke:3px #0f1724;paint-order:stroke fill;text-shadow:0 2px 0 #0f172488}
.cl{position:absolute;right:6px;top:2px;z-index:2;width:36px;height:36px;border:0;background:none;color:#8db0ee;font-size:24px;font-weight:900;text-shadow:0 2px 0 #0f1724;cursor:pointer;transition:transform .2s}.cl:hover{transform:rotate(90deg)}
.b{display:block;width:100%;margin:0 0 14px;padding:11px 0 13px;border:0;border-radius:9px;font:900 19px "Trebuchet MS",system-ui,"Noto Sans Bengali",sans-serif;letter-spacing:1px;color:#2a2016;background:var(--c);box-shadow:0 5px 0 var(--d),0 0 0 2px #0f172466;cursor:pointer;transition:transform .12s,box-shadow .12s,filter .2s;animation:rise .5s both}
.b:hover{filter:brightness(1.1)}.b:active{transform:translateY(4px);box-shadow:0 1px 0 var(--d)}
.b:nth-child(2){animation-delay:.07s}.b:nth-child(3){animation-delay:.14s}.b:nth-child(4){animation-delay:.21s}
.o{--c:#f5b63a;--d:#bf7f18}.pk{--c:#e553c8;--d:#a32c8b}.g{--c:#1faa84;--d:#0d6f58;color:#05281f}.lb{--c:#9fd4ee;--d:#5b98b8}
.row{display:flex;justify-content:space-between;align-items:center;background:#1c2a3d;border-radius:9px;padding:10px 12px;margin-bottom:14px;color:#fff;font-weight:900;font-size:15px;letter-spacing:1px;animation:rise .5s both}
.tg{width:58px;height:28px;border-radius:8px;border:3px solid #0f1724;background:#c43d4a;position:relative;cursor:pointer;padding:0;transition:background .25s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:18px;border-radius:5px;background:#fff;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.tg.on{background:#1faa84}.tg.on::after{transform:translateX(26px)}
.txt{margin:0 0 6px;color:#dbe7f5;font-size:15px;line-height:1.5;text-align:center;animation:rise .5s both}
.bt{white-space:pre-line;text-align:center;color:#9fe9ff;font-weight:700;font-size:14px;letter-spacing:1px;min-height:16px}
#pb{position:absolute;top:50px;right:14px;width:36px;height:36px;padding:0;border:0;border-radius:9px;background:#9fd4ee;box-shadow:0 4px 0 #5b98b8,0 0 0 2px #0f172466;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s,box-shadow .12s}
#pb:active{transform:translateY(3px);box-shadow:0 1px 0 #5b98b8}body.m #pb{display:none}
#ui.ps{background:rgba(2,3,10,.72)}#ui.ps #title{display:none}
.prow{display:grid;grid-template-columns:1fr 1fr;gap:16px 10px;justify-items:center}
.pi{display:flex;flex-direction:column;align-items:center;gap:12px;color:#fff;font-weight:900;font-size:12px;letter-spacing:.5px}
.ib{width:68px;height:68px;border:0;border-radius:12px;background:var(--c);box-shadow:0 5px 0 var(--d),0 0 0 2px #0f172466;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:transform .12s,box-shadow .12s;animation:rise .5s both}
.ib:active{transform:translateY(4px);box-shadow:0 1px 0 var(--d)}.pi:nth-child(2) .ib{animation-delay:.08s}.pi:nth-child(3) .ib{animation-delay:.16s}.pi:nth-child(4) .ib{animation-delay:.24s}
#splash{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at center,#06182a,#02030a 70%);transition:opacity .7s;font-family:"Trebuchet MS",system-ui,sans-serif}
#splash.out{opacity:0;pointer-events:none}
#spt{display:flex;font-weight:900;font-size:clamp(34px,11vw,56px);letter-spacing:4px;color:#fff}
#spt span{display:inline-block;opacity:0;transform:translateY(24px) scale(.6);filter:blur(10px);animation:ltr .7s cubic-bezier(.2,1.3,.4,1) forwards;text-shadow:0 0 18px #8ff3ff,0 3px 0 #0a3a4a}
#spl{height:3px;width:0;background:linear-gradient(90deg,transparent,#8ff3ff,transparent);box-shadow:0 0 12px #8ff3ff;animation:ln 1.4s .9s ease-out forwards}
@keyframes ltr{to{opacity:1;transform:none;filter:none}}
@keyframes ln{to{width:min(70vw,320px)}}
@media (prefers-reduced-motion:reduce){#spt span{opacity:1;transform:none;filter:none}#spl{width:min(70vw,320px)}}
@keyframes pop{from{opacity:0;transform:translateY(26px) scale(.84)}to{opacity:1;transform:none}}
#upm,#vm{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.82);font-family:"Trebuchet MS",system-ui,"Noto Sans Bengali",sans-serif}
.ubar{height:16px;border:3px solid #0f1724;border-radius:8px;background:#1c2a3d;overflow:hidden;margin:4px 0 12px}
.ubar i{display:block;height:100%;width:0;background:repeating-linear-gradient(115deg,#1faa84 0 12px,#0d6f58 12px 16px);transition:width .2s}
.spin{width:34px;height:34px;margin:0 auto 12px;border:4px solid #1c3550;border-top-color:#8ff3ff;border-radius:50%;animation:spn .9s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
#uweb small{margin-left:10px;opacity:.7;font-weight:700}
#okmsg{position:absolute;left:0;right:0;bottom:12%;text-align:center;color:#fff;font-weight:900;font-size:21px;letter-spacing:1px;text-shadow:0 0 14px #8ff3ff;animation:rise .5s both}
#ab{width:150px;height:12px;margin:7px 0 0 4px;box-sizing:border-box;background:#2b1a02;border:2px solid #5a3600;border-radius:6px;overflow:hidden}
#am{display:block;height:100%;width:100%;background:repeating-linear-gradient(90deg,#ffd13a 0 8px,#b8860b 8px 10px)}
#am.low{background:repeating-linear-gradient(90deg,#ff4b4b 0 8px,#8a1c1c 8px 10px)}
#p-about{padding-top:60px}
.abs{max-height:50vh;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;margin:0 -10px 10px;padding:0 10px}
.abs .txt{text-align:start}
.ah{margin:6px 0 10px;color:#9fe9ff;font-weight:900;font-size:16px;letter-spacing:1px;text-align:start}
.ai{margin:0 0 12px;text-align:start}
.ai b{display:block;color:#ffd13a;font-size:14px;letter-spacing:.5px;margin-bottom:2px}
.ai span{color:#dbe7f5;font-size:14px;line-height:1.5;font-weight:600}
.am{margin:0;padding-top:10px;border-top:2px solid #0f1724;font-size:14px}
#mail{color:#9fe9ff;font-weight:900;font-size:15px;word-break:break-all;user-select:text;-webkit-user-select:text}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes flt{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body style="background:#02030a">

<canvas id="c"></canvas>

<div class="row"><span data-t="sound">SOUND</span><button class="tg on" id="ts"></button></div>
<button class="b lb" id="uweb" style="margin:0 0 14px" data-t="updates">UPDATES</button><button class="b o" id="bkb" style="margin:0 0 14px" data-t="bk">SAVE DATA</button><button class="b pk" id="rsb" style="margin:0 0 14px" data-t="rs">RESTORE DATA</button><input type="file" id="rsf" style="position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0" tabindex="-1"><button class="b g" id="vbtn" style="margin:0" data-t="verb">VERSION</button>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,cx,cy,R,dpr;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth||innerWidth;H=cv.clientHeight||innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);cx=W/2;cy=H/2;R=Math.min(W,H)*.17}
addEventListener('resize',resize);addEventListener('orientationchange',resize);resize();
const stars=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),s:Math.random()*1.6+.4}));
let best=0;try{best=+localStorage.getItem('pgbest')||0}catch(e){}
let bestScore=0;try{bestScore=+localStorage.getItem('pgscore')||0}catch(e){}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
const $=id=>document.getElementById(id);
function showBest(){$('bt').textContent=bestScore?T('bt')+bestScore:'';$('best').textContent=''}
showBest();
let state='menu',ang=-Math.PI/2,tang=ang,score=0,ammo=100,rel=0,dry=0,pk=[],health=100,time=0,enemies=[],shots=[],parts=[],spawn=0,cool=0,last=0;
function start(){try{history.pushState({g:1},'')}catch(e){}state='play';tang=ang;health=100;score=0;hold=0;ammo=100;rel=0;time=0;enemies=[];shots=[];parts=[];fx=[];pk=[];spawn=0;$('ui').classList.add('hide');setMusic();$('joy').classList.remove('hide');last=performance.now()}
function end(){clearSnap();games++;lastScore=score;state='menu';$('joy').classList.add('hide');if(time>best){best=time;try{localStorage.setItem('pgbest',best)}catch(e){}}if(score>bestScore){bestScore=score;try{localStorage.setItem('pgscore',score)}catch(e){}}
saveData();$('title').dataset.t='lost';$('play').dataset.t='again';showBest();applyLang();$('bt').textContent=T('scl')+score;openPanel('main');$('ui').classList.remove('hide');setMusic()}

function T(k){return D&&(D[L][k]||D.en[k])||''}
function applyLang(){document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T(e.dataset.t));$('lg').textContent=T('langt');showBest()}
function openPanel(n){document.querySelectorAll('#ui .panel').forEach(p=>p.classList.toggle('hide',p.id!=='p-'+n))}

function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function beep(f,d,t,v){if(!soundOn)return;try{const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),n=a.currentTime;o.type=t;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f*.4,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(a.destination);o.start();o.stop(n+d)}catch(e){}}
function setMusic(){document.body.classList.toggle('m',state!=='play');const a=ac();if(!a)return;if(!mus){const g=a.createGain();g.gain.value=0;g.connect(a.destination);[110,164.8,220.4].forEach(f=>{const o=a.createOscillator();o.type='sine';o.frequency.value=f;o.connect(g);o.start()});mus=g}mus.gain.setTargetAtTime(musicOn&&state==='play'&&!paused?.035:0,a.currentTime,.3)}
$('tm').onclick=e=>{musicOn=!musicOn;e.currentTarget.classList.toggle('on',musicOn);setMusic();saveData()};

function runUpd(){const g=$('upgo'),f=$('upf');g.classList.add('hide');$('upl').classList.remove('hide');$('upn').dataset.t='updl';applyLang();
let p=0,done=false;const t0=Date.now();
const tick=setInterval(()=>{p+=(done?100-p:88-p)*(done?.2:.06);f.style.width=p+'%';if(done&&p>98.5){clearInterval(tick);f.style.width='100%';setTimeout(()=>{try{localStorage.setItem('pgupd','1')}catch(e){}location.reload()},400)}},80);
fetch(location.pathname,{cache:'reload'}).then(r=>{if(!r.ok)throw 0;return r.text()}).then(()=>setTimeout(()=>{done=true},Math.max(0,1800-(Date.now()-t0)))).catch(()=>{clearInterval(tick);f.style.width='0';$('upl').classList.add('hide');g.classList.remove('hide');$('upn').dataset.t='updf';applyLang()})}
function chkUpd(manual){if(manual)flash('chking');return fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{const nw=+j.version>VER;if(nw){newV=+j.version;upSize=j.size||'';doUpd(newV)}else if(manual)flash('uptd')}).catch(()=>{if(manual)flash('uptd')})}
$('upgo').onclick=runUpd;
try{if(localStorage.getItem('pgupd')){localStorage.removeItem('pgupd');setTimeout(()=>$('okmsg').classList.remove('hide'),3500);setTimeout(()=>$('okmsg').classList.add('hide'),7500)}}catch(e){}

var paused=false;
function pauseGame(){if(state!=='play'||paused)return;paused=true;openPanel('pause');$('ui').classList.add('ps');$('ui').classList.remove('hide');setMusic()}

$('pb').onclick=pauseGame;$('pr').onclick=resume;$('pre').onclick=restart;$('pst').onclick=()=>openPanel('settings');
$('pm').onclick=()=>{clearSnap();if(score>bestScore){bestScore=score;try{localStorage.setItem('pgscore',score)}catch(e){}}paused=false;state='menu';$('joy').classList.add('hide');$('ui').classList.remove('ps');$('title').dataset.t='title';$('play').dataset.t='play';openPanel('main');applyLang();setMusic()};
(function(){const t=$('spt');'SPACE FIGHT'.split('').forEach((c,i)=>{const s=document.createElement('span');s.textContent=c===' '?'\u00a0':c;s.style.animationDelay=(.25+i*.13)+'s';t.appendChild(s)});
const sp=$('splash');let done=false;function fin(){if(done)return;done=true;sp.classList.add('out');openPanel('x');void sp.offsetWidth;openPanel(restored?'pause':'main');setTimeout(()=>sp.remove(),800)}
setTimeout(fin,3300)})();

var restored=false,sv=0;
function saveGame(){return;try{if(state!=='play')return;localStorage.setItem('pgsnap',JSON.stringify({s:score,h:health,a:ammo,t:time,g:ang,d:dry,e:enemies.filter(e=>!e.dead).map(e=>[(e.x-cx)/R,(e.y-cy)/R,e.sp]),p:pk.map(k=>[(k.x-cx)/R,(k.y-cy)/R])}))}catch(e){}}
function clearSnap(){try{localStorage.removeItem('pgsnap')}catch(e){}}
function saveBest(){if(score>bestScore){bestScore=score;try{localStorage.setItem('pgscore',score)}catch(e){}}saveData()}
function autoPause(){if(state!=='play')return;saveBest();saveGame();if(!paused)pauseGame()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)autoPause()});
addEventListener('pagehide',autoPause);
try{addEventListener('popstate',()=>{if(state==='play'){if(!paused)pauseGame();else history.pushState({g:1},'')}})}catch(e){}
try{clearSnap();const sn=null;if(sn){score=sn.s;health=sn.h;ammo=sn.a;time=sn.t;ang=sn.g;tang=ang;dry=sn.d||0;enemies=sn.e.map(a=>({x:cx+a[0]*R,y:cy+a[1]*R,sp:a[2]}));pk=sn.p.map(a=>({x:cx+a[0]*R,y:cy+a[1]*R}));shots=[];parts=[];state='play';paused=true;restored=true;$('joy').classList.remove('hide');$('ui').classList.add('ps');document.body.classList.remove('m')}}catch(e){clearSnap()}
function aim(e){if(state!=='play')return;const p=e.touches?e.touches[0]:e;ang=Math.atan2(p.clientY-cy,p.clientX-cx)}
const joy=$('joy'),knob=$('knob');let jon=false;
function jmove(e){const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+60),dy=e.clientY-(r.top+60),l=Math.hypot(dx,dy);if(l>5)tang=Math.atan2(dy,dx);const k=Math.min(l,40)/(l||1);knob.style.left=(40+dx*k)+'px';knob.style.top=(40+dy*k)+'px'}
joy.addEventListener('pointerdown',e=>{e.preventDefault();jon=true;joy.setPointerCapture(e.pointerId);jmove(e)});
joy.addEventListener('pointermove',e=>{if(jon)jmove(e)});
const jend=()=>{jon=false;knob.style.left='40px';knob.style.top='40px'};
joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
function fire(){if(state!=='play'||paused||cool>0||ammo<8)return;cool=.22;ammo-=8;rel=.5;beep(700,.12,'square',.04);const d=R+20;shots.push({x:cx+Math.cos(ang)*d,y:cy+Math.sin(ang)*d,vx:Math.cos(ang)*520,vy:Math.sin(ang)*520,life:2,ph:Math.random()*3});fx.push({k:'m',t:0,d:.14})}
var hold=0;cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(x){}hold++;fire()});['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>{hold=Math.max(0,hold-1)}));
const keys={};addEventListener('keydown',e=>{keys[e.key]=1;if(e.key===' ')fire()});addEventListener('keyup',e=>keys[e.key]=0);
function boom(x,y,c){for(let i=0;i<10;i++){const a=Math.random()*6.28,s=40+Math.random()*120;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5,c})}}

/* ===== PIXEL FX: bullet sprite, muzzle flash, explosion ===== */
const BUL=["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABYAAAAHCAYAAAAMPr0FAAAAeUlEQVR4nGNkwAFCeMT+45LDBtZ8ecWIzGfBZZgKCycDAwMDgy2HELFm/0c2nBHZQGyGeRWdhzAKs7Eb1z+VYVufIQMDAwPD/C9P4S5nCeER+49uIKphVgwMLFNwu7OQgcGLAWE4zV2MEuCUhDGyoRgG47KEGICeKgDmmTSQe5MUsQAAAABJRU5ErkJggg==","data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABYAAAAHCAYAAAAMPr0FAAAAgElEQVR4nGNkIABCeMT+E1KDDNZ8ecXIwMDAwELIMBUWTgYGBgYGWw4hYs3+v+bLK0ZGbAZiM8yr6DyEUZiN3bj+qQzb+gwZGBgYGOZ/eYpwcQiP2H90A1ENs2JgYJmC252FDAxeDAjDaeZiRmxqKAnj+V+eMmCEMSFLiAGwVAEA+cQveuLpZ7cAAAAASUVORK5CYII=","data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABYAAAAHCAYAAAAMPr0FAAAAeUlEQVR4nGNkwAFCeMT+45LDBtZ8ecWIzGfBZZgKCycDAwMDgy2HELFm/0c2nBHZQGyGeRWdhzAKs7Eb1z+VYVufIQMDAwPD/C9P4S5nCeER+49uIKphVgwMLFNwu7OQgcGLAWE4zV2MEuCUhDGyoRgG47KEGICeKgDmmTSQe5MUsQAAAABJRU5ErkJggg=="].map(u=>{const i=new Image();i.src=u;return i});
function rng(seed){return()=>((seed=(seed*16807)%2147483647)/2147483647)}
const EXP=[],MUZ=[];
(function(){
const N=48,C=N/2,col={o:'#ff9a1f',d:'#e8590c',y:'#ffd23c',w:'#fff6c8',g1:'#9a9a9a',g2:'#6b6b6b',g3:'#454545',g4:'#2e2e2e'};
// each layer: [inner radius, outer radius, color]; null color = hole
const spec=[
 {l:[[0,3,'o']],sp:0},
 {l:[[0,5,'o'],[0,2.5,'y']],sp:0},
 {l:[[0,8,'d'],[0,6.5,'o'],[0,3.5,'y']],sp:0},
 {l:[[0,11,'d'],[0,9.5,'o'],[0,6,'y'],[0,5.5,'g1'],[0,3,'g2']],sp:4},
 {l:[[0,13,'d'],[0,11.5,'o'],[0,9.5,'g1'],[0,6,'g2'],[0,3.5,'g3']],sp:7},
 {l:[[0,14,'d'],[0,12.5,'o'],[0,11,'g1'],[0,7,'g2'],[0,4,null]],sp:9},
 {l:[[0,14,'g3'],[0,12.5,'g2'],[0,10,'g3'],[0,6.5,null]],sp:10,orange:7},
 {l:[[0,13,'g4'],[0,11.5,'g3'],[0,8,null]],sp:10,fade:1}
];
spec.forEach((f,fi)=>{
 const cv=document.createElement('canvas');cv.width=cv.height=N;const g=cv.getContext('2d');
 const r=rng(77+fi*13),ph=[r()*6.28,r()*6.28,r()*6.28];
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  const dx=x+.5-C,dy=y+.5-C,a=Math.atan2(dy,dx);
  const n=1+.16*Math.sin(a*3+ph[0])+.12*Math.sin(a*5+ph[1])+.08*Math.sin(a*8+ph[2]);
  const d=Math.hypot(dx,dy)/n;let c=undefined;
  for(const L of f.l){if(d>=L[0]&&d<L[1])c=L[2]}
  if(c){g.fillStyle=col[c];g.fillRect(x,y,1,1)}
 }
 // debris specks
 for(let i=0;i<f.sp;i++){const a=r()*6.28,rr=11+r()*10,x=Math.round(C+Math.cos(a)*rr),y=Math.round(C+Math.sin(a)*rr);
  g.fillStyle=f.fade||fi>5?(r()<.5?'#fff':col.g1):(r()<.6?col.o:col.y);g.fillRect(x,y,1,1);if(r()<.4)g.fillRect(x+1,y,1,1)}
 if(f.orange)for(let i=0;i<f.orange;i++){const a=r()*6.28,rr=9+r()*5;g.fillStyle=col.o;g.fillRect(Math.round(C+Math.cos(a)*rr),Math.round(C+Math.sin(a)*rr),1,1)}
 EXP.push(cv)});
// muzzle flash: 4 frames, 14x12, points right, origin at left-middle
const mp=[['w','y','o','d'],['w','y','o','d'],['y','o','d','d'],['o','d','d','d']];
const mlen=[5,9,12,8],mh=[2,4,5,3];
for(let f=0;f<4;f++){const cv=document.createElement('canvas');cv.width=14;cv.height=12;const g=cv.getContext('2d');
 for(let x=0;x<mlen[f];x++){const t=x/mlen[f],hh=Math.max(0,Math.round(mh[f]*(1-t*t)*(f==3?1.3-t:1)));
  for(let y=-hh;y<=hh;y++){const e=Math.abs(y)/(hh||1),k=Math.min(3,Math.floor(Math.max(e,t)*3.2));
   g.fillStyle=col[mp[f][k]];g.fillRect(x,6+y-(y>0?0:0),1,1)}}
 MUZ.push(cv)}
})();
var fx=[];
function explode(x,y,sc){fx.push({k:'e',x,y,t:0,d:.62,sc:sc||1})}
function drawFx(){
 ctx.imageSmoothingEnabled=false;
 for(const f of fx){
  if(f.k==='e'){const i=Math.min(7,Math.floor(f.t/f.d*8)),z=48*1.5*f.sc;ctx.drawImage(EXP[i],Math.round(f.x-z/2),Math.round(f.y-z/2),z,z)}
  else{const i=Math.min(3,Math.floor(f.t/f.d*4)),d=R+20+10;ctx.save();ctx.translate(cx+Math.cos(ang)*d,cy+Math.sin(ang)*d);ctx.rotate(ang);ctx.drawImage(MUZ[i],0,-6*2,14*2,12*2);ctx.restore()}
 }
}

function update(dt){
sv+=dt;if(sv>1){sv=0;saveGame()}
time+=dt;cool-=dt;rel-=dt;if(rel<=0)ammo=Math.min(100,ammo+34*dt);if(hold>0)fire();
if(keys.ArrowLeft)tang-=3*dt;if(keys.ArrowRight)tang+=3*dt;
const df=Math.atan2(Math.sin(tang-ang),Math.cos(tang-ang)),mx=9*dt;ang+=Math.max(-mx,Math.min(mx,df));
spawn-=dt;
if(spawn<=0&&enemies.length<Math.min(5,2+Math.floor(time/20))){spawn=1.2;const a=Math.random()*6.28,d=Math.max(W,H)*.65;
enemies.push({x:cx+Math.cos(a)*d,y:cy+Math.sin(a)*d,sp:45+Math.random()*25})}
for(const e of enemies){const a=Math.atan2(cy-e.y,cx-e.x);e.a=a;e.x+=Math.cos(a)*e.sp*dt;e.y+=Math.sin(a)*e.sp*dt;
if(Math.hypot(e.x-cx,e.y-cy)<R){e.dead=1;health-=12;explode(e.x,e.y,1.25);boom(e.x,e.y,'#ff9d5c')}}
for(const s of shots){let n=null,nd=110;for(const e of enemies){if(e.dead)continue;const q=Math.hypot(e.x-s.x,e.y-s.y);if(q<nd&&((e.x-s.x)*s.vx+(e.y-s.y)*s.vy)>.5*q*520){nd=q;n=e}}
if(n){const ca=Math.atan2(s.vy,s.vx),ta=Math.atan2(n.y-s.y,n.x-s.x),df=Math.atan2(Math.sin(ta-ca),Math.cos(ta-ca)),st=Math.max(-3.5*dt,Math.min(3.5*dt,df)),na=ca+st;s.vx=Math.cos(na)*520;s.vy=Math.sin(na)*520}
s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
if(s.x<0||s.x>W||s.y<0||s.y>H||Math.hypot(s.x-cx,s.y-cy)>Math.hypot(W,H)*.55){s.life=0;const bx=Math.max(0,Math.min(W,s.x)),by=Math.max(0,Math.min(H,s.y));explode(bx,by,.4)}
for(const e of enemies){if(!e.dead&&Math.hypot(e.x-s.x,e.y-s.y)<16){e.dead=1;s.life=0;explode(e.x,e.y,1);boom(e.x,e.y,'#ff4b4b');beep(180,.25,'sawtooth',.06);score+=10;saveBest();if(health<100&&!pk.length&&(++dry>=14||Math.random()<.03+(100-health)*.003)){pk.push({x:e.x,y:e.y});dry=0}const nn=1+Math.floor(Math.random()*2);for(let k=0;k<nn;k++){if(enemies.length<(Math.random()<.15?6:5)){const ra=Math.random()*6.28,dd=Math.max(W,H)*.65;enemies.push({x:cx+Math.cos(ra)*dd,y:cy+Math.sin(ra)*dd,sp:45+Math.random()*25})}}}}}
enemies=enemies.filter(e=>!e.dead);shots=shots.filter(s=>s.life>0);
const sx=cx+Math.cos(ang)*(R+20),sy=cy+Math.sin(ang)*(R+20);
for(const k of pk){const a=Math.atan2(cy-k.y,cx-k.x);k.x+=Math.cos(a)*35*dt;k.y+=Math.sin(a)*35*dt;if(Math.hypot(sx-k.x,sy-k.y)<20){k.got=1;health=100;boom(sx,sy,'#00e5ff')}else if(Math.hypot(cx-k.x,cy-k.y)<R)k.got=1}
pk=pk.filter(k=>!k.got);
for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);for(const f of fx)f.t+=dt;fx=fx.filter(f=>f.t<f.d);
if(health<=0){health=0;end()}
}
function draw(){
ctx.fillStyle='#02030a';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#fff';for(const s of stars){ctx.globalAlpha=.4+.5*Math.abs(Math.sin(performance.now()/1500+s.x*9));ctx.fillRect(s.x*W,s.y*H,s.s,s.s)}ctx.globalAlpha=1;
const pr=state==='menu'?R*1.6:R,px=state==='menu'?W*.85:cx,py=state==='menu'?H*.62+Math.sin(performance.now()/1200)*7:cy;
ctx.save();ctx.shadowColor='#3ab8ff';ctx.shadowBlur=16;ctx.fillStyle='#2fa6f5';ctx.beginPath();ctx.arc(px,py,pr,0,6.28);ctx.fill();ctx.restore();
ctx.save();ctx.beginPath();ctx.arc(px,py,pr,0,6.28);ctx.clip();ctx.fillStyle='#4a9a35';
[[-.3,-.3,.34],[.35,-.1,.4],[-.05,.35,.22],[.5,.4,.16],[-.5,.15,.18]].forEach(b=>{ctx.beginPath();ctx.arc(px+b[0]*pr,py+b[1]*pr,b[2]*pr,0,6.28);ctx.fill()});ctx.restore();
if(state!=='play')return;
for(const e of enemies){ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.a);ctx.fillStyle='#d8302f';ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(-2,-3);ctx.lineTo(-8,-9);ctx.lineTo(-5,0);ctx.lineTo(-8,9);ctx.lineTo(-2,3);ctx.closePath();ctx.fill();ctx.restore()}
ctx.imageSmoothingEnabled=false;for(const s of shots){const im=BUL[Math.floor(time*18+s.ph)%3];ctx.save();ctx.translate(s.x,s.y);ctx.rotate(Math.atan2(s.vy,s.vx));ctx.drawImage(im,-22,-7,44,14);ctx.restore()}
for(const p of parts){ctx.globalAlpha=p.l*2;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1;
for(const k of pk){ctx.save();ctx.shadowColor='#00e5ff';ctx.shadowBlur=14;ctx.fillStyle='#00bcd4';ctx.beginPath();ctx.arc(k.x,k.y,11,0,6.28);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#1f8a4c';ctx.font='700 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('HP',k.x,k.y+1);ctx.restore()}
const d=R+20;ctx.save();ctx.translate(cx+Math.cos(ang)*d,cy+Math.sin(ang)*d);ctx.rotate(ang);ctx.fillStyle='#f5a623';ctx.shadowColor='#f5a623';ctx.shadowBlur=8;ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(-7,-8);ctx.lineTo(-3,0);ctx.lineTo(-7,8);ctx.closePath();ctx.fill();ctx.restore();
drawFx();
}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
if((cv.clientWidth&&cv.clientWidth!==W)||(cv.clientHeight&&cv.clientHeight!==H))resize();
try{if(state==='play'&&!paused){update(dt);$('sc').textContent=score;$('am').style.width=ammo+'%';$('am').classList.toggle('low',ammo<8);$('hp').style.width=health+'%'}
draw()}catch(err){console.error(err)}
requestAnimationFrame(loop)}
requestAnimationFrame(t=>{last=t;loop(t)});
</script>
